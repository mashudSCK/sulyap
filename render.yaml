services:
  # Web Service for Sulyap Backend
  - type: web
    name: sulyap
    runtime: node
    region: oregon  # Choose: oregon, frankfurt, singapore, ohio
    plan: free
    buildCommand: npm install --workspace=backend --omit=dev
    startCommand: npm run start --workspace=backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
    # Auto-deploy on git push
    autoDeploy: true
